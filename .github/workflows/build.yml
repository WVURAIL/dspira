name: Build
'on':
  push:
    branches-ignore:
    - main
  pull_request: null
  workflow_dispatch: null
  workflow_call:
    inputs:
      pages_artifact:
        type: boolean
        default: false
      hardware_revision:
        type: string
        default: ''
      notebook_revision:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  jekyll:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        lfs: true
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    - name: Test migration compatibility
      run: |
        python3 tools/test_publish_pages.py
        python3 tools/test_retired_sites.py
    - name: Build
      run: |
        python3 tools/export_assembly_guides.py --check
        python3 tools/test_export_assembly_guides.py
        python3 -m pip install --quiet PyMuPDF==1.28.2
        python3 -m pip install --quiet -r tools/notebook-requirements.txt
        bundle exec jekyll build --trace
        python3 tools/test_publish_assets.py
        python3 tools/test_publish_hardware.py
        python3 tools/test_publish_notebooks.py
        args=(--site _site)
        if [ -n "$HARDWARE_REVISION" ]; then args+=(--hardware-revision "$HARDWARE_REVISION"); fi
        if [ -n "$NOTEBOOK_REVISION" ]; then args+=(--notebook-revision "$NOTEBOOK_REVISION"); fi
        python3 tools/publish_assets.py "${args[@]}"
        python3 tools/check_notebook_pages.py --site _site
        python3 tools/check_teaching_documents.py --site _site --style
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        JEKYLL_ENV: production
        HARDWARE_REVISION: ${{ inputs.hardware_revision }}
        NOTEBOOK_REVISION: ${{ inputs.notebook_revision }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: WVURAIL/wvurail.github.io
        ref: ebaef70170bc770905f01e5f7bff1432d3a6a51f
        path: .dependencies/checks
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - name: Trim unused Design System styles
      run: |
        npm ci --prefix .dependencies/checks/.github/site-tools
        node .dependencies/checks/.github/site-tools/scripts/trim_styles.mjs _site assets/wvu-design-system/site.min.css
    - name: Embedded videos and watch links
      run: python3 tools/check_videos.py --site _site
    - name: Every lesson and index page built
      run: |
        set -euo pipefail
        missing=0
        for page in index.html all/index.html lesson-modules/index.html \
                    about/index.html kits/index.html user-levels/index.html \
                    404.html iq/index.html
        do
          [ -s "_site/$page" ] || { echo "::error::_site/$page missing or empty"; missing=1; }
        done
        # Every lesson in _posts must produce a page.
        want=$(ls _posts | wc -l)
        got=$(find _site -name index.html -newer _config.yml | wc -l)
        echo "posts in _posts: $want"
        [ "$want" -ge 40 ] || { echo "::error::only $want posts found — did _posts get truncated?"; missing=1; }
        exit $missing
    - name: The data-driven lists actually rendered
      run: |
        set -euo pipefail
        fail=0
        check() {  # name, file, pattern, minimum
          n=$(grep -o "$3" "_site/$2" | wc -l || true)
          echo "$1: $n"
          if [ "$n" -lt "$4" ]; then
            echo "::error::$1 rendered $n (expected >= $4) — data or a Liquid filter is broken"
            fail=1
          fi
        }
        # The module grid is driven by _data/modules.yml cross-referenced
        # against post categories. A category renamed in one place and not the
        # other still builds — it just silently drops a module.
        #
        # The expected number is read from _data/modules.yml rather than
        # written down here. It used to be a hardcoded 9, which was right
        # until the modules were consolidated and then quietly wrong: a check
        # with a number copied into it has the same drift problem as the thing
        # it is checking.
        modules=$(grep -c '^- category:' _data/modules.yml)
        echo "modules declared in _data/modules.yml: $modules"

        check "modules on the front page" index.html     'class="module"'          "$modules"
        # /all/ is the only lesson index now; /lesson-modules/ redirects to it,
        # so the module headings live here.
        check "module sections in /all/"  all/index.html  'class="module-toc__head"' "$modules"
        check "lesson cards in /all/"     all/index.html  'class="lesson-card"'     40
        # The Design System's navigation script drives the list that carries
        # this class. grep -o counts substrings, so 1 means "the nav is there".
        check "nav links"                 index.html      'js-wvu-site-nav-items'   1

        # Every module the front page shows must also be a page you can open.
        # tr -d CR because a checkout with core.autocrlf on yields CRLF, and a
        # slug with a carriage return on the end matches no directory.
        for slug in $(grep '^- category:' _data/modules.yml \
                      | sed 's/^- category: *//' \
                      | tr -d '\r' | tr 'A-Z' 'a-z' | tr ' ' '-'); do
          [ -s "_site/categories/$slug/index.html" ] \
            || { echo "::error::module '$slug' has no page at /categories/$slug/ — the name in _data/modules.yml and the lessons' categories: have diverged"; fail=1; }
        done

        exit $fail
    - name: Every lesson has one module and a position in it
      run: |
        python3 - <<'PY'
        import glob, re, sys, collections
        bad, by_module = [], collections.defaultdict(list)
        for path in sorted(glob.glob("_posts/*.md")):
            fm = open(path, encoding="utf-8").read().split("---")[1]
            cats = re.search(r"^categories:\s*(.*)$", fm, re.M)
            order = re.search(r"^order:\s*(\d+)\s*$", fm, re.M)
            if not cats:
                bad.append("%s: no categories:" % path); continue
            names = re.findall(r"'([^']+)'|\"([^\"]+)\"", cats.group(1))
            names = [a or b for a, b in names]
            if len(names) != 1:
                bad.append("%s: filed under %d modules (%s) — one only" % (path, len(names), ", ".join(names)))
                continue
            if not order:
                bad.append("%s: no order: — it would sort to the front of %s" % (path, names[0]))
                continue
            by_module[names[0]].append((int(order.group(1)), path))

        for module, items in sorted(by_module.items()):
            nums = sorted(n for n, _ in items)
            if nums != list(range(1, len(nums) + 1)):
                dupes = [n for n in set(nums) if nums.count(n) > 1]
                bad.append("%s: order is %s, expected 1..%d%s"
                           % (module, nums, len(nums),
                              " (duplicated: %s)" % dupes if dupes else ""))

        for b in bad:
            print("::error::" + b)
        print("%d lessons across %d modules" % (sum(len(v) for v in by_module.values()), len(by_module)))
        sys.exit(1 if bad else 0)
        PY
    - name: The forum rooms send people to their GitHub Discussions category
      run: |
        set -euo pipefail
        # The rooms are plain pages now. SCM ruled that nothing forum-like may
        # be served from the University domain, so the giscus comment boxes
        # went; each room links to the Discussions category on GitHub where
        # its threads have always lived. The slug comes from _data/forum.yml,
        # and a wrong one is a 404 on GitHub rather than a build error — so
        # the six URLs are spelled out here as well, verified live, and the
        # two copies have to agree.
        fail=0
        for pair in index:general antennas:antennas astronomy:astronomy \
                    dsp:dsp electronics:electronics gnuradio:gnu-radio
        do
          room=${pair%%:*}
          slug=${pair##*:}
          if [ "$room" = index ]; then
            f="_site/forum/index.html"
          else
            f="_site/forum/$room/index.html"
          fi
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty"; fail=1; continue
          fi
          grep -qF "href=\"https://github.com/WVURAIL/dspira/discussions/categories/$slug\"" "$f" \
            || { echo "::error::$f does not link to the '$slug' Discussions category"; fail=1; }
        done
        echo "forum rooms checked: 6"
        # And no page may mention giscus at all. If the word is back, so is a
        # comment box, or the include that made one.
        if grep -rli 'giscus' _site --include='*.html'; then
          echo "::error::giscus is back in the built site — see the pages listed above"
          fail=1
        fi
        exit $fail
    - name: WVU common elements on every page
      run: |
        set -euo pipefail
        fail=0
        checked=0
        while IFS= read -r f; do
          if grep -q '<title>Redirecting' "$f"; then continue; fi
          checked=$((checked + 1))
          for want in "favicon-wvu.ico" \
                      "(304) 293-9686" "Fax" "Skip to main content"
          do
            grep -qF -- "$want" "$f" \
              || { echo "::error::$f lacks \"$want\""; fail=1; }
          done
          n=$(grep -o '<h1' "$f" | wc -l || true)
          [ "$n" -eq 1 ] \
            || { echo "::error::$f has $n <h1> headings, expected exactly 1"; fail=1; }
        done < <(find _site -name '*.html' | sort)
        echo "pages checked: $checked"
        # A check that found nothing to check would pass for the wrong reason.
        [ "$checked" -ge 60 ] \
          || { echo "::error::only $checked pages checked — did _site build?"; fail=1; }
        # The old GBT address is a redirect and stays out of the sitemap.
        if [ ! -s _site/sitemap.xml ] || grep -q 'gbt_rendered_2017\.html' _site/sitemap.xml; then
          echo "::error::_site/sitemap.xml is missing, or still lists gbt_rendered_2017.html — the notebook must retain sitemap: false in its front matter"
          fail=1
        fi
        exit $fail
    - name: No unrendered Liquid escaped into the output
      run: |
        set -euo pipefail
        if grep -rn '{%\|{{' _site --include='*.html'; then
          echo "::error::Found unrendered Liquid tags in the built site"
          exit 1
        fi
        echo "No unrendered Liquid."
    - name: Lesson search and history
      run: node --test tools/test_lesson_filter.js
    - name: Software downloads
      run: node --test tools/test_file_downloads.js
    - name: Heading anchors resolve
      run: python3 tools/check_links.py --offline --fail-on anchors
    - name: The link checker itself still works
      run: python3 tools/test_check_links.py
    - name: The maths check itself still works
      run: python3 tools/check_math.py --self-test
    - name: Displayed equations are actually displayed
      run: python3 tools/check_math.py
    - name: Install a browser for the rendered checks
      run: |
        python3 -m pip install --quiet playwright
        python3 -m playwright install --with-deps chromium
    - name: The layout check itself still works
      run: python3 tools/check_layout.py --self-test
    - name: No page scrolls sideways
      run: python3 tools/check_layout.py --site _site
    - name: The contrast check itself still works
      run: python3 tools/check_contrast.py --self-test
    - name: Every piece of text meets WCAG AA
      run: python3 tools/check_contrast.py --site _site
    - name: Load verified historical material
      run: |
        python3 tools/test_retired_sites.py
        python3 tools/retired_sites.py fetch --destination _retired
        python3 tools/retired_sites.py history --source _retired --site _site
    - name: Preserve old institute addresses
      run: |
        python3 tools/test_publish_pages.py
        python3 tools/publish_pages.py --site _site --archive _retired/dspira-archive --archive-url https://rail.wvu.edu/dspira/history/sites/dspira-archive/
        test -s _site/index.html
        test -s _site/teach/index.html
        test -s _site/labs/01/index.html
        test ! -e _site/CNAME
        if grep -q 'name="robots" content="noindex"' _site/index.html; then exit 1; fi
        grep -q 'href="/dspira/' _site/index.html
    - name: Upload the built site
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site
        path: _site
        retention-days: 7
    - name: Package the validated site
      if: ${{ inputs.pages_artifact }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: _site
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
