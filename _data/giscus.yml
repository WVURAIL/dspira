# giscus configuration for the forum rooms.
#
# giscus (https://giscus.app) puts a comment box on a page and keeps what people
# write as a GitHub Discussion. It replaced utterances, which kept comments as
# GitHub *Issues* — that stopped working when issue creation was restricted on
# this repository, so the old boxes still rendered but nobody could post.
#
# Every id here came from the GitHub API, not from guesswork:
#
#   gh api graphql -f query='
#   {
#     repository(owner: "WVURAIL", name: "dspira-lessons") {
#       id
#       discussionCategories(first: 25) { nodes { id name } }
#     }
#   }'
#
# These are legacy-format node ids, the base64 style, which is what that query
# returns today. GitHub has said the legacy format "will be closing down", with
# no date announced. Re-run the query with `-H "X-Github-Next-Global-ID: 1"` to
# get the replacements and paste them in here — this file is the only place they
# are written down, so nothing else has to change.
#
# The repository and its discussions are public. These are public identifiers,
# not credentials.

repo: "WVURAIL/dspira-lessons"
repo_id: "MDEwOlJlcG9zaXRvcnkyNzg2NzQ0OTI="

# Light, because the forum pages sit on the light reading surface. Matches the
# `github-light` the utterances boxes used.
theme: light

# One entry per room, keyed by the name the page passes to _includes/giscus.html.
#
# `category` and `category_id` must describe the same Discussions category, and
# `term` must be the EXACT title of the discussion holding that room's thread.
# Those titles are not decorative: utterances created them years ago from the
# page path, and giscus finds a thread by searching titles. Change one and the
# room's history stops appearing — giscus will not error, it will quietly offer
# an empty thread. Check against
# https://github.com/WVURAIL/dspira-lessons/discussions before editing.
rooms:
  index:
    category: General
    category_id: "MDE4OkRpc2N1c3Npb25DYXRlZ29yeTEzODU0ODIy"
    term: "dspira-lessons/forum/"
  antennas:
    category: Antennas
    category_id: "DIC_kwDOEJw8PM4DDa4W"
    term: "dspira-lessons/forum/antennas/"
  astronomy:
    category: Astronomy
    category_id: "MDE4OkRpc2N1c3Npb25DYXRlZ29yeTMyMzQ2MTMz"
    term: "dspira-lessons/forum/astronomy/"
  dsp:
    category: DSP
    category_id: "MDE4OkRpc2N1c3Npb25DYXRlZ29yeTMyMzQ2MTMy"
    term: "dspira-lessons/forum/dsp/"
  electronics:
    category: Electronics
    category_id: "MDE4OkRpc2N1c3Npb25DYXRlZ29yeTMyMzQ2MTIz"
    term: "dspira-lessons/forum/electronics/"
  gnuradio:
    category: GNU Radio
    category_id: "DIC_kwDOEJw8PM4DDa4P"
    term: "dspira-lessons/forum/gnuradio/"
