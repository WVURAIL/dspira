# The forum rooms. Each one is a category of this repository's GitHub
# Discussions.
#
# The DSPIRA forum has always been kept in GitHub Discussions: first through
# utterances, which filed posts as Issues, then through giscus, which put a
# comment box on each room page and stored what people wrote as a Discussion in
# the category below. The threads go back to 2020.
#
# The boxes are gone. WVU Strategic Communications ruled that nothing forum-like
# may be served from the University domain, so the room pages now send people
# to the category on GitHub, where the conversations have been all along.
# Reading is open to everyone; posting needs a free GitHub account.
#
# Keys are the room names the pages use: forum/<key>.md publishes at
# /forum/<key>/, and `index` is /forum/ itself. For each room:
#
#   category  the category's display name on GitHub
#   slug      its path segment under
#             https://github.com/WVURAIL/dspira/discussions/categories/
#             A wrong slug is a 404 on GitHub, not a build error — check the
#             page before editing one. The build does assert that each room
#             links to the URL it expects, so a change here must be made in
#             .github/workflows/build.yml as well.
#   blurb     one sentence on what belongs there, shown on /forum/
#
# The `thread` comments are the exact titles of the discussions that carried
# each room's comment box — utterances created them from the page path, hence
# no leading slash. Nothing reads them now; they are here for the record, so
# that the old conversations can be found by title and so that the giscus
# `data-term` values are written down somewhere if a box is ever allowed again.

repo: "WVURAIL/dspira"

rooms:
  index:
    category: General
    slug: general
    blurb: >-
      Questions about the lessons or the program, introductions, and anything
      that does not belong in one of the other rooms.
    # thread: "dspira/forum/"
  antennas:
    category: Antennas
    slug: antennas
    blurb: >-
      Horn telescopes and other antennas: designs, construction, mounts, and how
      they perform on the sky.
    # thread: "dspira/forum/antennas/"
  astronomy:
    category: Astronomy
    slug: astronomy
    blurb: >-
      Explore the astronomy behind observations: neutral hydrogen's 21 cm line, Milky Way rotation, and spectral interpretation.
    # thread: "dspira/forum/astronomy/"
  dsp:
    category: DSP
    slug: dsp
    blurb: >-
      Digital signal processing in general: sampling, the Fourier transform,
      filters, and how a spectrometer works.
    # thread: "dspira/forum/dsp/"
  electronics:
    category: Electronics
    slug: electronics
    blurb: >-
      The electronics between the horn and the computer: low-noise amplifiers,
      filters, software-defined radios, cables and power.
    # thread: "dspira/forum/electronics/"
  gnuradio:
    category: GNU Radio
    slug: gnu-radio
    blurb: >-
      GNU Radio and related software-defined radio tools: installing them, the
      flowgraphs in the lessons, and the DSPIRA processing blocks.
    # thread: "dspira/forum/gnuradio/"
